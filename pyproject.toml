[project]
name = "studyspace"
version = "0.1.0"
description = "Studyspace: turns course messages into a confirmed task list and a realistic study plan (DSS5105 Track 4)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.scripts]
studyspace = "studyspace.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studyspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx`"]

[tool.uv]
# copy instead of clone from the uv cache: on some macOS setups cloned .pth files keep a "hidden" flag
# and Python then skips them, which shows up as "No module named studyspace"
link-mode = "copy"
